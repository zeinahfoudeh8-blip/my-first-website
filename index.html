<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noor | Daily Islamic Reminder</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f5f5ef;
      text-align: center;
      color: #234d20;
    }
    header {
      background-color: #1f6f50;
      padding: 60px 20px;
      color: white;
    }
    h1 {
      font-size: 45px;
      margin: 0;
    }
    header p {
      font-size: 18px;
    }
    button {
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      background-color: #ffd369;
      font-size: 18px;
      cursor: pointer;
      margin-top: 20px;
      font-weight: bold;
      color: #222;
    }
    section {
      padding: 50px 20px;
    }
    .card {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <header>
    <h1>🌙 Noor</h1>
    <p>One small reminder. One better day.</p>
    <button onclick="document.getElementById('reminder').scrollIntoView({behavior: 'smooth'});">
      Read Today's Reminder
    </button>
  </header>

  <section id="reminder">
    <div class="card">
      <h2>Today's Reminder</h2>
      <p>"The best of people are those who are most beneficial to others."</p>
    </div>
  </section>

</body>
</html>
